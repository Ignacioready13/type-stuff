name: Build and Deploy Monkeytype
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-engine-strict

      - name: Build Dependencies and Frontend
        env:
          RECAPTCHA_SITE_KEY: "6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"
        run: |
          # 1. Install everything across the whole repo
          pnpm install --no-frozen-lockfile
          
          # 2. Build the internal packages (util, schemas, etc.)
          # This creates the @monkeytype/util files the frontend is missing
          pnpm run build --filter="./packages/**"
         
          cp ../dist/index.html ../dist/404.html
          # 3. Finally build the frontend
          cd frontend
          pnpm run build
        


      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4